<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LureSystems</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Apple / iPhone PWA Meta Etiketleri -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LureSystems">
    <link rel="apple-touch-icon" href="https://i.hizliresim.com/ebrr6uci.jpg">
</head>
<body>
    <!-- Arka Plan Atmosferik Işık Efekti -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="app-container">

        <!-- SEKME 1: ANA SAYFA (SADECE KARŞILAMA VE GÜNÜN SKORU) -->
        <section id="tab-home" class="tab-content active">
            <div class="home-hero">
                <div class="brand-pill">
                    <img src="https://i.hizliresim.com/ebrr6uci.jpg" alt="Logo" class="hero-logo">
                    <span>LureSystems Core</span>
                </div>
                
                <div class="hero-text-group">
                    <h1 id="greeting-title" class="hero-title">Merhaba Semih</h1>
                    <p id="weather-display" class="hero-weather">☁️ Soma: 23°C, Bulutlu</p>
                    <div id="date-time-display" class="hero-datetime">Yükleniyor...</div>
                </div>

                <!-- Günün Disiplin Skoru Kartı -->
                <div class="card home-score-card">
                    <div class="score-card-header">
                        <h3>Günün Disiplin Skoru</h3>
                        <span id="progress-text-home" class="score-percentage">%0</span>
                    </div>
                    <div class="progress-bar-container">
                        <div id="progress-bar-home" class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SEKME 2: YAPILACAKLAR (GÜNLÜK AKIŞ) -->
        <section id="tab-todos" class="tab-content">
            <header class="section-header">
                <h2>Günlük Akış</h2>
                <p>Sabah kalkıştan gece yatışa kadar komuta sende.</p>
            </header>

            <div class="card list-card">
                <ul id="habit-list" class="habit-list">
                    <!-- JS ile doldurulacak -->
                </ul>
            </div>
        </section>

        <!-- SEKME 3: İSTATİSTİKLER -->
        <section id="tab-stats" class="tab-content">
            <header class="section-header">
                <h2>İstatistik Merkezi</h2>
                <p>Zinciri kırma! Alışkanlıklarının seri rekorları.</p>
            </header>

            <div class="card stats-card">
                <h3>🔥 Seri Durumları</h3>
                <div id="streak-list" class="stats-list">
                    <!-- JS ile doldurulacak -->
                </div>
            </div>
        </section>

        <!-- ALT NAVİGASYON (MOBILE BOTTOM BAR) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home', event)">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Ana Sayfa</span>
            </button>
            <button class="nav-item" onclick="switchTab('todos', event)">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Yapılacaklar</span>
            </button>
            <button class="nav-item" onclick="switchTab('stats', event)">
                <span class="nav-icon">📊</span>
                <span class="nav-label">İstatistik</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
