<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LureSystems - Disiplin Paneli</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Apple / iPhone PWA Meta Etiketleri -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LureSystems">
    <link rel="apple-touch-icon" href="https://i.hizliresim.com/ebrr6uci.jpg">
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header>
            <div class="brand-area">
                <img src="https://i.hizliresim.com/ebrr6uci.jpg" alt="LureSystems Logo" class="brand-logo">
                <h1>LureSystems</h1>
            </div>
            <p id="date-display"></p>
        </header>

        <!-- SEKME 1: GÜNLÜK AKIŞ -->
        <section id="tab-daily" class="tab-content active">
            <!-- Genel İlerleme Kartı -->
            <div class="card summary-card">
                <h3>Günün Disiplin Skoru</h3>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <span id="progress-text">%0 Tamamlandı</span>
            </div>

            <!-- Günlük Görevler / Alışkanlıklar Listesi -->
            <div class="card">
                <h3>Günlük Komuta Merkezi</h3>
                <ul id="habit-list" class="habit-list">
                    <!-- Javascript ile doldurulacak -->
                </ul>
            </div>
        </section>

        <!-- SEKME 2: SERİLER & İSTATİSTİKLER -->
        <section id="tab-streaks" class="tab-content">
            <div class="card">
                <h3>🔥 Seri & Zincir Durumu</h3>
                <p class="section-desc">Zinciri kırma! Her gün tamamladığın alışkanlıklar serini büyütür.</p>
                <div id="streak-list" class="stats-list">
                    <!-- JS ile doldurulacak -->
                </div>
            </div>
        </section>

        <!-- SEKME 3: BAŞARIMLAR & ÖDÜLLER -->
        <section id="tab-achievements" class="tab-content">
            <div class="card">
                <h3>🏆 Kupa Odası & Rozetler</h3>
                <p class="section-desc">Disiplinini korudukça açılan unvanlar ve başarımlar.</p>
                <div id="achievement-list" class="achievement-grid">
                    <!-- JS ile doldurulacak -->
                </div>
            </div>
        </section>

        <!-- ALT NAVİGASYON (MOBILE BOTTOM BAR) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('daily')">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Akış</span>
            </button>
            <button class="nav-item" onclick="switchTab('streaks')">
                <span class="nav-icon">🔥</span>
                <span class="nav-label">Seriler</span>
            </button>
            <button class="nav-item" onclick="switchTab('achievements')">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">Başarımlar</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
